{{- if .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ske-mcp-server.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ske-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}

